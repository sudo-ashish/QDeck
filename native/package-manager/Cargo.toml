[package]
name    = "qdeck-pkg"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qdeck-pkg"
path = "src/main.rs"

[dependencies]
ratatui       = "0.29"
crossterm     = { version = "0.28", features = ["event-stream"] }
tokio         = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "io-util", "macros"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
reqwest       = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
fuzzy-matcher = "0.3"
unicode-width = "0.2"
anyhow        = "1"
libc          = "0.2"
toml          = "0.8"

[profile.release]
opt-level = 3
strip     = true
lto       = true
